[package]
name = "gsa-engine"
version = "0.1.0"
edition = "2021"
description = "GSA (General Sorting Algorithm) Engine — a resource-maximizing hybrid CPU/GPU sort server"

[lib]
name = "gsa_engine"
path = "src/lib.rs"

[[bin]]
name = "gsa-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
local-ip-address = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"
core-graphics-types = "0.1"

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "sort_bench"
harness = false
