<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="radixBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fd6ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#0b0e14"/>
  <rect x="0.5" y="0.5" width="899" height="499" fill="none" stroke="#232838"/>

  <text x="40" y="38" fill="#e6e9f0" font-size="20" font-weight="700">Why GSA defaults to CPU radix sort over the GPU</text>
  <text x="40" y="59" fill="#8b93a7" font-size="12.5">Apple M4 &#183; lower is better &#183; log scale (ms) &#183; GPU bitonic sort loses at every size tested (500 &#8211; 40,000,000 elements)</text>

  <line x1="70" y1="400" x2="870" y2="400" stroke="#232838" stroke-width="1"/>

  <!-- legend -->
  <rect x="560" y="20" width="12" height="12" fill="url(#radixBar)" rx="2"/>
  <text x="578" y="30" fill="#c7cdda" font-size="12.5">CPU radix sort</text>
  <rect x="690" y="20" width="12" height="12" fill="#f87171" rx="2"/>
  <text x="708" y="30" fill="#c7cdda" font-size="12.5">GPU bitonic sort</text>

  <!-- group: n=10,000 -->
  <text x="160" y="420" fill="#8b93a7" font-size="12.5" text-anchor="middle">10,000</text>
  <rect x="110" y="374" width="46" height="26" fill="url(#radixBar)" rx="3"/>
  <text x="133" y="366" fill="#c7cdda" font-size="11" text-anchor="middle">0.17ms</text>
  <rect x="164" y="314" width="46" height="86" fill="#f87171" rx="3"/>
  <text x="187" y="306" fill="#f2b8b8" font-size="11" text-anchor="middle">0.61ms</text>
  <text x="160" y="440" fill="#8b93a7" font-size="11.5" text-anchor="middle">radix 3.6x faster</text>

  <!-- group: n=100,000 -->
  <text x="320" y="420" fill="#8b93a7" font-size="12.5" text-anchor="middle">100,000</text>
  <rect x="270" y="331" width="46" height="69" fill="url(#radixBar)" rx="3"/>
  <text x="293" y="323" fill="#c7cdda" font-size="11" text-anchor="middle">0.42ms</text>
  <rect x="324" y="247" width="46" height="153" fill="#f87171" rx="3"/>
  <text x="347" y="239" fill="#f2b8b8" font-size="11" text-anchor="middle">2.48ms</text>
  <text x="320" y="440" fill="#8b93a7" font-size="11.5" text-anchor="middle">radix 5.9x faster</text>

  <!-- group: n=1,000,000 -->
  <text x="480" y="420" fill="#8b93a7" font-size="12.5" text-anchor="middle">1,000,000</text>
  <rect x="430" y="247" width="46" height="153" fill="url(#radixBar)" rx="3"/>
  <text x="453" y="239" fill="#c7cdda" font-size="11" text-anchor="middle">2.47ms</text>
  <rect x="484" y="181" width="46" height="219" fill="#f87171" rx="3"/>
  <text x="507" y="173" fill="#f2b8b8" font-size="11" text-anchor="middle">9.84ms</text>
  <text x="480" y="440" fill="#8b93a7" font-size="11.5" text-anchor="middle">radix 4.0x faster</text>

  <!-- group: n=5,000,000 -->
  <text x="640" y="420" fill="#8b93a7" font-size="12.5" text-anchor="middle">5,000,000</text>
  <rect x="590" y="176" width="46" height="224" fill="url(#radixBar)" rx="3"/>
  <text x="613" y="168" fill="#c7cdda" font-size="11" text-anchor="middle">10.96ms</text>
  <rect x="644" y="76" width="46" height="324" fill="#f87171" rx="3"/>
  <text x="667" y="68" fill="#f2b8b8" font-size="11" text-anchor="middle">90.69ms</text>
  <text x="640" y="440" fill="#8b93a7" font-size="11.5" text-anchor="middle">radix 8.3x faster</text>

  <!-- group: n=40,000,000 -->
  <text x="800" y="420" fill="#8b93a7" font-size="12.5" text-anchor="middle">40,000,000</text>
  <rect x="750" y="123" width="46" height="277" fill="url(#radixBar)" rx="3"/>
  <text x="773" y="115" fill="#c7cdda" font-size="11" text-anchor="middle">90.6ms</text>
  <rect x="804" y="26" width="46" height="374" fill="#f87171" rx="3"/>
  <text x="825" y="18" fill="#f2b8b8" font-size="10.5" text-anchor="middle">1010.5ms</text>
  <text x="800" y="440" fill="#8b93a7" font-size="11.5" text-anchor="middle">radix 11.2x faster</text>

  <text x="40" y="475" fill="#565f74" font-size="11">elements sorted &#8594;</text>
  <text x="40" y="491" fill="#565f74" font-size="10.5">Bitonic sort is O(n log&#178;n) compare-exchanges; radix sort is O(n) &#8212; the gap widens as n grows, it isn't an implementation bug.</text>
</svg>
